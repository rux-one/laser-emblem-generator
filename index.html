<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emblem Generator</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header>
    <h1>Emblem Generator</h1>
  </header>
  <main>
    <section class="controls">
      <label>
        <span class="label-text">Text</span>
        <textarea id="text-input" rows="4" placeholder="Your text here...">EMBLEM</textarea>
      </label>

      <label>
        <span class="label-text">Font</span>
        <select id="font-select"></select>
      </label>

      <label>
        <span class="label-text">Weight</span>
        <select id="weight-select"></select>
      </label>

      <label>
        <span class="label-text">
          Size
          <output id="size-output">8</output> pt
        </span>
        <input type="range" id="size-input" min="2" max="20" step="0.5" value="8" />
      </label>

      <label>
        <span class="label-text">Align</span>
        <select id="align-select">
          <option value="middle">Center</option>
          <option value="start">Left</option>
          <option value="end">Right</option>
        </select>
      </label>

      <label>
        <span class="label-text">
          Line height
          <output id="lh-output">1.2</output>×
        </span>
        <input type="range" id="lh-input" min="0.8" max="3.0" step="0.1" value="1.2" />
      </label>
    </section>

    <section class="preview-area">
      <div id="svg-container">
        <div id="loading-indicator">Loading fonts…</div>
      </div>
      <div id="overflow-warning" class="hidden">Text overflows shape — reduce font size or shorten text</div>
      <div class="action-row">
        <button id="download-btn" disabled>Download SVG</button>
        <button id="share-btn" disabled>Share</button>
      </div>
      <div id="share-panel" class="hidden">
        <input id="share-url" type="text" readonly />
        <button id="copy-btn" title="Copy to clipboard" aria-label="Copy to clipboard">
          <svg class="icon-copy" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <svg class="icon-check" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </button>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
