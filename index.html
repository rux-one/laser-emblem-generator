<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emblem Generator</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header>
    <h1>Emblem Generator</h1>
  </header>
  <main>
    <section class="controls">
      <label>
        <span class="label-text">Text</span>
        <textarea id="text-input" rows="4" placeholder="Your text here...">EMBLEM</textarea>
      </label>

      <label>
        <span class="label-text">Font</span>
        <select id="font-select"></select>
      </label>

      <label>
        <span class="label-text">Weight</span>
        <select id="weight-select"></select>
      </label>

      <label>
        <span class="label-text">
          Size
          <output id="size-output">8</output> pt
        </span>
        <input type="range" id="size-input" min="2" max="20" step="0.5" value="8" />
      </label>

      <label>
        <span class="label-text">Align</span>
        <select id="align-select">
          <option value="middle">Center</option>
          <option value="start">Left</option>
          <option value="end">Right</option>
        </select>
      </label>

      <label>
        <span class="label-text">
          Line height
          <output id="lh-output">1.2</output>×
        </span>
        <input type="range" id="lh-input" min="0.8" max="3.0" step="0.1" value="1.2" />
      </label>
    </section>

    <section class="preview-area">
      <div id="svg-container">
        <div id="loading-indicator">Loading fonts…</div>
      </div>
      <div id="overflow-warning" class="hidden">Text overflows shape — reduce font size or shorten text</div>
      <button id="download-btn" disabled>Download SVG</button>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
